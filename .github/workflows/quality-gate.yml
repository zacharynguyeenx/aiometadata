name: Quality Gate

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
    paths-ignore:
      - 'docs/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run build:backend
